<app-navbar></app-navbar>
<div class="registration-container">
    <div class="registration-card">
        <h2 class="card-header">Register</h2>
        <div class="card-body">
            <!-- Success/Error Messages -->
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
                <span class="material-icons">check_circle</span>
                {{successMessage}}
            </div>

            <div *ngIf="errorMessage" class="alert alert-error" role="alert">
                <span class="material-icons">error</span>
                {{errorMessage}}
            </div>

            <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="mx-auto">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill" aria-hidden="true"></i>
                            </span>
                        </div>
                        <input type="email" id="email" class="form-control" placeholder="example@mail.com"
                            formControlName="email" autocomplete="email"
                            [attr.aria-describedby]="email?.errors ? 'email-error' : null"
                            [class.is-invalid]="email?.invalid && email?.touched" />
                    </div>
                    <div *ngIf="email?.invalid && email?.touched" id="email-error" class="form-error">
                        <span *ngIf="email?.errors?.['required']">Email is required</span>
                        <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input [type]="passwordFieldType" id="password" class="form-control" formControlName="password"
                            autocomplete="new-password"
                            [attr.aria-describedby]="password?.errors ? 'password-error' : null"
                            [class.is-invalid]="password?.invalid && password?.touched" />
                        <div class="input-group-append">
                            <button type="button" class="input-group-text" (click)="togglePasswordVisibility()"
                                [attr.aria-label]="passwordFieldType === 'password' ? 'Show password' : 'Hide password'">
                                <i class="bi" [ngClass]="passwordIconClass"></i>
                            </button>
                        </div>
                    </div>
                    <div *ngIf="password?.invalid && password?.touched" id="password-error" class="form-error">
                        <span *ngIf="password?.errors?.['required']">Password is required</span>
                        <span *ngIf="password?.errors?.['minlength']">Password must be at least 8 characters</span>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Repeat your password</label>
                    <div class="input-group">
                        <input [type]="confirmPasswordFieldType" id="confirmPassword" class="form-control"
                            formControlName="password_confirmation" autocomplete="new-password"
                            [attr.aria-describedby]="registrationForm.errors?.['passwordMismatch'] ? 'confirm-password-error' : null"
                            [class.is-invalid]="registrationForm.errors?.['passwordMismatch'] && confirmPassword?.touched" />
                        <div class="input-group-append">
                            <button type="button" class="input-group-text" (click)="toggleConfirmPasswordVisibility()"
                                [attr.aria-label]="confirmPasswordFieldType === 'password' ? 'Show password' : 'Hide password'">
                                <i class="bi" [ngClass]="confirmPasswordIconClass"></i>
                            </button>
                        </div>
                    </div>
                    <div *ngIf="registrationForm.errors?.['passwordMismatch'] && confirmPassword?.touched"
                        id="confirm-password-error" class="form-error">
                        Passwords do not match
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block"
                    [disabled]="registrationForm.invalid || isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"
                        aria-hidden="true"></span>
                    {{isLoading ? 'Registering...' : 'Register'}}
                </button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
