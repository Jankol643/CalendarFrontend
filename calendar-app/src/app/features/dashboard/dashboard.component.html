<mat-sidenav-container class="main-container dashboard">
    <mat-sidenav #sidenav [mode]="sidenavMode" [opened]="isSidebarOpen" (openedChange)="onSidenavChange($event)">
        <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
        <app-top-bar (toggleSidebar)="toggleSidebar()"></app-top-bar>
        <app-calendar></app-calendar>
    </mat-sidenav-content>
</mat-sidenav-container>
