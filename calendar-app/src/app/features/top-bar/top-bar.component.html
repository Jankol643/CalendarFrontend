<mat-toolbar class="topbar">
    <!-- Sidebar Toggle Button -->
    <button mat-icon-button aria-label="Toggle Sidebar" (click)="onToggleSidebar()" class="icon-only">
        <mat-icon>menu</mat-icon>
    </button>

    <!-- Generate Mock Data Button -->
    <button mat-icon-button aria-label="Generate mock data" (click)="generateMockData()" class="icon-only">
        <mat-icon>shuffle</mat-icon>
    </button>

    <!-- Navigation Buttons -->
    <div class="navigation-buttons">
        <button mat-raised-button color="primary" (click)="onNavigationChange('previous')">Previous</button>
        <button mat-stroked-button color="primary" (click)="onNavigationChange('today')">Today</button>
        <button mat-raised-button color="primary" (click)="onNavigationChange('next')">Next</button>
    </div>

    <!-- View Selector and Logout -->
    <div class="view-logout">
        <mat-form-field appearance="outline" class="view-selector">
            <mat-label>View</mat-label>
            <mat-select [(value)]="view" (selectionChange)="onViewChange($event.value)">
                <mat-option [value]="CalendarView.Month">Month</mat-option>
                <mat-option [value]="CalendarView.Week">Week</mat-option>
                <mat-option [value]="CalendarView.Day">Day</mat-option>
            </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="export()">Export Data</button>
        <button mat-raised-button color="warn" (click)="logout()">Logout</button>
    </div>
</mat-toolbar>
